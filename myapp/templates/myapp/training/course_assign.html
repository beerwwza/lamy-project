{% extends 'myapp/training/base.html' %}
{% block title %}มอบหมายหลักสูตร - Knowledge Center{% endblock %}
{% block page_title %}มอบหมายหลักสูตรให้พนักงาน{% endblock %}

{% block training_content %}
<div class="max-w-lg mx-auto bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-6">
  <h3 class="font-bold text-slate-800 dark:text-slate-100 mb-4">{{ course.name }}</h3>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">พนักงาน</label>
      <select name="employee_id" required class="w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-lg p-2 text-sm">
        {% for emp in employees %}
        <option value="{{ emp.id }}">{{ emp.name }} ({{ emp.department }})</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">วันที่เข้าอบรม</label>
      <input type="date" name="date" value="{{ today|date:'Y-m-d' }}" required class="w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-lg p-2 text-sm">
    </div>
    <div class="flex gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
      <a href="{% url 'training_courses' %}" class="flex-1 py-2 text-center text-slate-600 dark:text-slate-300 font-bold bg-slate-100 dark:bg-slate-700 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition">ยกเลิก</a>
      <button type="submit" class="flex-1 py-2 text-center text-white font-bold bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-md transition">มอบหมาย</button>
    </div>
  </form>
</div>
{% endblock %}
