{% extends 'myapp/base.html' %}
{% block layout %}
<div class="min-h-screen bg-slate-50 dark:bg-slate-950 flex flex-col">
  <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-6 flex-shrink-0">
    <span class="font-bold text-lg text-indigo-600 dark:text-indigo-400 flex items-center gap-2">
      <i data-lucide="graduation-cap" class="w-5 h-5"></i> Knowledge Center - โหมดเรียน
    </span>
    {% block kiosk_header_actions %}{% endblock %}
  </header>
  <main class="flex-1 p-6 md:p-10">
    <div class="max-w-3xl mx-auto">
      {% if messages %}
      <div class="space-y-2 mb-4">
        {% for message in messages %}
        <div class="px-4 py-3 rounded-lg text-sm font-medium
            {% if message.tags == 'success' %}bg-emerald-50 border border-emerald-200 text-emerald-700{% elif message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700{% else %}bg-blue-50 border border-blue-200 text-blue-700{% endif %}">
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}
      {% block kiosk_content %}{% endblock %}
    </div>
  </main>
</div>
{% endblock layout %}
