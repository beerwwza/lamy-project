{# ป้ายสถานะใบงาน ME — 4 สีตามขั้นตอน (ส่ง obj=MEInspection) #}
<span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold whitespace-nowrap
    {% if obj.status == 'repairing' %}bg-sky-100 text-sky-800 dark:bg-sky-900/40 dark:text-sky-300
    {% elif obj.status == 'wait_cbm' %}bg-violet-100 text-violet-800 dark:bg-violet-900/40 dark:text-violet-300
    {% elif obj.status == 'wait_approval' %}bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300
    {% else %}bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300{% endif %}">{{ obj.get_status_display }}</span>
