{# หัวการ์ดแต่ละหมวดค่าวัด CBM พร้อมช่องผู้ตรวจสอบ/วันที่ของหมวดนั้น #}
<div class="px-5 py-3 bg-teal-50 dark:bg-teal-900/20 border-b border-teal-100 dark:border-teal-900/40 flex flex-col md:flex-row md:items-center justify-between gap-3">
    <div class="flex items-center gap-3">
        <div class="p-2 rounded-lg bg-teal-100 dark:bg-teal-900/50 text-teal-700 dark:text-teal-300">
            <i data-lucide="{{ icon }}" class="w-4 h-4"></i>
        </div>
        <div>
            <h4 class="text-sm font-bold text-slate-800 dark:text-slate-100">{{ title }}</h4>
            {% if subtitle %}<p class="text-xs text-slate-500 dark:text-slate-400">{{ subtitle }}</p>{% endif %}
        </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 w-full md:w-96">
        {% include 'myapp/includes/me_field.html' with field=inspector label='ผู้ตรวจสอบ' %}
        {% include 'myapp/includes/me_field.html' with field=date label='วันที่ตรวจ' %}
    </div>
</div>
